version: "3.9"

services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./wp-content:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:latest
    platform: linux/amd64
    container_name: wordpress_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.19.0
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - wordpress
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  locust:
    image: locustio/locust:latest
    container_name: locust
    ports:
      - "8089:8089"
    volumes:
      - ./scripts/locustfile.py:/home/locust/locustfile.py
    command: -f /home/locust/locustfile.py --host=http://nginx
    depends_on:
      - nginx
      - wordpress

  wp-init:
    build:
      context: .
      dockerfile: Dockerfile.wordpress
    container_name: wp-init
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./wp-content:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    command: /usr/local/bin/init-wordpress.sh

volumes:
  db_data:
